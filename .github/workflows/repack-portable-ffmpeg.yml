name: Package portable FFmpeg source and runtime notices
on:
  workflow_dispatch:
  push:
    branches: [codex/ffmpeg-management]
    paths:
      - tools/repack-ffmpeg.py
      - .github/workflows/repack-portable-ffmpeg.yml
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42353389139 --name ffmpeg-8.1.3-nv12.2-win-x64 --dir stage
      - name: Obtain compiler runtime copyright notices
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64-common gcc-mingw-w64-x86-64-posix
      - name: Prepare distribution archives
        run: python3 tools/repack-ffmpeg.py stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ffmpeg-runtime-ready
          path: |
            stage/out/FFmpeg-8.1.3-bce-nv12.2-win-x64.zip
            stage/out/artifacts.json
            stage/out/SHA256SUMS.txt
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ffmpeg-source-ready
          path: stage/out/FFmpeg-8.1.3-bce-nv12.2-source-kit.zip
          compression-level: 0
