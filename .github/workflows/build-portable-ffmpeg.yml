name: Build portable FFmpeg 8.1.3 with NVENC 12.2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install cross compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix nasm cmake ninja-build meson pkg-config
      - name: Build fixed sources
        run: bash third_party/portable-build/build.sh
      - name: Preserve configuration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ffmpeg-build-diagnostics
          path: |
            ${{ runner.temp }}/bce-ffmpeg-8.1.3/source-kit/*.log
            ${{ runner.temp }}/bce-ffmpeg-8.1.3/src/ffmpeg/ffbuild/config.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ffmpeg-8.1.3-nv12.2-win-x64
          path: ${{ runner.temp }}/bce-ffmpeg-8.1.3/out/*
          compression-level: 0
          retention-days: 30
